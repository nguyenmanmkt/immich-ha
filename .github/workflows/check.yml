name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-ha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit publishable files
        run: python tools/prepare-github.py
      - name: Test Python
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test JavaScript
        run: node --test tests/*.test.mjs
      - name: Check shell syntax
        run: for file in node/*.sh node/app-run-v2 node/standby-run; do bash -n "$file"; done
      - name: Check embedded UI
        run: |
          python tools/embed-ui.py
          git diff --exit-code -- src/admin-ui.mjs
