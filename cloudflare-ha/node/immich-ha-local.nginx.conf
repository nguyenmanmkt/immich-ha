# Generated installer replaces placeholders; the installed file is root-only.
map $http_upgrade $immich_ha_local_connection {
    default upgrade;
    '' close;
}

# Trust forwarded HTTPS only from the loopback proxy used by a later Funnel.
map "$remote_addr:$http_x_forwarded_proto" $immich_ha_local_scheme {
    default $scheme;
    "127.0.0.1:https" https;
    "::1:https" https;
}

server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;
    client_max_body_size 0;

    allow 127.0.0.0/8;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    allow fc00::/7;
    deny all;
    satisfy all;

    error_page 401 403 500 502 504 =503 @immich_ha_local_unavailable;
    location @immich_ha_local_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '{"message":"This Immich server is not active or its grant is unavailable."}';
    }

    location ^~ /__ha/ { return 404; }
    location = /_immich_ha_local_authorize {
        internal;
        proxy_pass http://127.0.0.1:9081/authorize-local;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Immich-HA-Token "__ORIGIN_TOKEN__";
        proxy_set_header X-Immich-HA-Epoch "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location / {
        auth_request /_immich_ha_local_authorize;
        proxy_pass http://127.0.0.1:2283;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $immich_ha_local_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Immich-HA-Token "";
        proxy_set_header X-Immich-HA-Epoch "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $immich_ha_local_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
