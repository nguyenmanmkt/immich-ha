map $http_upgrade $immich_witness_connection {
    default upgrade;
    '' close;
}
map "$remote_addr:$http_x_forwarded_proto" $immich_witness_scheme {
    default $scheme;
    "127.0.0.1:https" https;
    "::1:https" https;
}
map $immich_witness_owner $immich_witness_target {
    default "";
    primary __PRIMARY_TARGET__;
    backup __BACKUP_TARGET__;
}
upstream immich_witness_selector {
    server unix:/run/immich-ha-router/route.sock;
}
server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;
    client_max_body_size 0;
    allow 127.0.0.0/8;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    allow fc00::/7;
    deny all;
    satisfy all;
    error_page 401 403 500 502 504 =503 @immich_witness_unavailable;
    location @immich_witness_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '{"message":"No confirmed active Immich route is available."}';
    }
    location ^~ /__ha/ { return 404; }
    location = /_immich_witness_route {
        internal;
        proxy_pass http://immich_witness_selector/route;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 8s;
    }
    location / {
        auth_request /_immich_witness_route;
        auth_request_set $immich_witness_owner $upstream_http_x_immich_ha_node;
        auth_request_set $immich_witness_epoch $upstream_http_x_immich_ha_epoch;
        proxy_pass http://$immich_witness_target$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $immich_witness_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Immich-HA-Token "";
        proxy_set_header X-Immich-HA-Epoch "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $immich_witness_connection;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Immich-HA-Node $immich_witness_owner always;
        add_header X-Immich-HA-Epoch $immich_witness_epoch always;
    }
}
