map $http_upgrade $immich_ha_connection {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 0;

    location = /__ha/health {
        proxy_pass http://127.0.0.1:9081/health;
        proxy_set_header X-Immich-HA-Token $http_x_immich_ha_token;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /_immich_ha_authorize {
        internal;
        proxy_pass http://127.0.0.1:9081/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Immich-HA-Token $http_x_immich_ha_token;
        proxy_set_header X-Immich-HA-Epoch $http_x_immich_ha_epoch;
    }

    location / {
        auth_request /_immich_ha_authorize;
        proxy_pass http://127.0.0.1:2283;
        proxy_http_version 1.1;
        proxy_set_header Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $immich_ha_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
